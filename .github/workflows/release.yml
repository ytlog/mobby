name: Publish Android release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name, for example 0.1.0 (creates tag v0.1.0)"
        required: true
        type: string
      version_code:
        description: "Android versionCode; increase for each update"
        required: true
        type: string

      replace_existing:
        description: "Replace an existing version after the new APK passes verification"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free hosted runner disk for native builds
        shell: bash
        run: |
          set -euo pipefail
          df -h "$GITHUB_WORKSPACE"
          # Hosted runners contain large toolchains this Android project does not use.
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h "$GITHUB_WORKSPACE"

      - name: Validate release inputs and signing secrets
        id: validate
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          VERSION_CODE: ${{ inputs.version_code }}
          REPLACE_EXISTING: ${{ inputs.replace_existing }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MOBBY_RELEASE_KEYSTORE_BASE64: ${{ secrets.MOBBY_RELEASE_KEYSTORE_BASE64 }}
          MOBBY_RELEASE_STORE_PASSWORD: ${{ secrets.MOBBY_RELEASE_STORE_PASSWORD }}
          MOBBY_RELEASE_KEY_ALIAS: ${{ secrets.MOBBY_RELEASE_KEY_ALIAS }}
          MOBBY_RELEASE_KEY_PASSWORD: ${{ secrets.MOBBY_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]] || { echo 'Select the repository default branch for releases'; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Version must be major.minor.patch'; exit 1; }
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]] && (( ${#VERSION_CODE} <= 10 )) && (( VERSION_CODE <= 2100000000 )) || { echo 'Invalid Android versionCode'; exit 1; }
          : "${MOBBY_RELEASE_KEYSTORE_BASE64:?Missing keystore secret}"
          : "${MOBBY_RELEASE_STORE_PASSWORD:?Missing store password}"
          : "${MOBBY_RELEASE_KEY_ALIAS:?Missing key alias}"
          : "${MOBBY_RELEASE_KEY_PASSWORD:?Missing key password}"
          if tag_ref=$(git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}"); then
            [[ "$REPLACE_EXISTING" == true ]] || { echo "Tag v${VERSION} already exists; select replace_existing to rebuild it"; exit 1; }
            printf 'tag_sha=%s\n' "${tag_ref%%[[:space:]]*}" >> "$GITHUB_OUTPUT"
          else
            result=$?
            if (( result != 2 )); then
              echo 'Could not check remote tags'
              exit "$result"
            fi
          fi
          printf '%s' "$MOBBY_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mobby-release.jks"
          test -s "$RUNNER_TEMP/mobby-release.jks"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          set +o pipefail
          yes | "$sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager" --install 'platforms;android-35' 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'

      - name: Check runtime protocols and Android unit tests
        run: |
          python3 -m unittest discover -s runtime -p 'test_*.py'
          node --test runtime/gateway-tests/bridge.test.cjs
          python3 runtime/check_dependency_sources.py
          ./gradlew :app:testDebugUnitTest :runtime-android:testDebugUnitTest :termux-core:testDebugUnitTest :app:lintDebug

      - name: Build signed, optimized release APK
        env:
          VERSION: ${{ inputs.version }}
          VERSION_CODE: ${{ inputs.version_code }}
          MOBBY_RELEASE_STORE_FILE: ${{ runner.temp }}/mobby-release.jks
          MOBBY_RELEASE_STORE_PASSWORD: ${{ secrets.MOBBY_RELEASE_STORE_PASSWORD }}
          MOBBY_RELEASE_KEY_ALIAS: ${{ secrets.MOBBY_RELEASE_KEY_ALIAS }}
          MOBBY_RELEASE_KEY_PASSWORD: ${{ secrets.MOBBY_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -Pmobby.versionName="$VERSION" -Pmobby.versionCode="$VERSION_CODE"

      - name: Verify APK and prepare release assets
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          test -s app/build/outputs/mapping/release/mapping.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -F "versionCode='$VERSION_CODE' versionName='$VERSION'"
          mkdir -p release-assets
          cp "$apk" "release-assets/mobby-v${VERSION}-arm64-v8a.apk"
          (cd release-assets && sha256sum *.apk > SHA256SUMS.txt)

      - name: Save R8 mapping for crash analysis
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping-v${{ inputs.version }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          VERSION_CODE: ${{ inputs.version_code }}
          REPLACE_EXISTING: ${{ inputs.replace_existing }}
          PREVIOUS_TAG_SHA: ${{ steps.validate.outputs.tag_sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if [[ -n "$PREVIOUS_TAG_SHA" ]]; then
            [[ "$REPLACE_EXISTING" == true ]]
            current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')
            [[ "$current_sha" == "$PREVIOUS_TAG_SHA" ]] || { echo 'Release tag changed during build; refusing to replace it'; exit 1; }
            gh release view "$tag" --json body --jq '.body' > "$RUNNER_TEMP/release-notes.md"
            gh release upload "$tag" release-assets/* --clobber
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" -f sha="$GITHUB_SHA" -F force=true > /dev/null
            printf '\n\nRebuilt from `%s` with Android versionCode `%s`.\n' "$GITHUB_SHA" "$VERSION_CODE" >> "$RUNNER_TEMP/release-notes.md"
            gh release edit "$tag" --target "$GITHUB_SHA" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$tag" release-assets/* --target "$GITHUB_SHA" --title "$tag" --generate-notes
          fi

      - name: Remove temporary signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/mobby-release.jks"
