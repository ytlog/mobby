<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="550" viewBox="0 0 1440 550" role="img" aria-label="mobby 网关、Agent 与手机工作区的数据路径"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#101b31"/><stop offset="1" stop-color="#192f45"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12" fill="#72d9d0"/></marker></defs><rect width="1440" height="550" fill="url(#g)"/><text x="72" y="91" fill="#f5f8ff" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="46" font-weight="700" text-anchor="start">一次任务，两个边界</text><text x="72" y="134" fill="#a2b3d0" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="500" text-anchor="start">本机执行命令；模型请求经你配置的网关发送。</text><rect x="72" y="202" width="392" height="205" rx="31" fill="#24324d" stroke="#526381"/><text x="102" y="258" fill="#f5f8ff" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="32" font-weight="650" text-anchor="start">手机界面</text><text x="102" y="320" fill="#a9eee3" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="500" text-anchor="start">选择 Agent、工作区</text><text x="102" y="356" fill="#a2b3d0" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="500" text-anchor="start">查看回复与步骤</text><rect x="522" y="202" width="392" height="205" rx="31" fill="#24324d" stroke="#526381"/><text x="552" y="258" fill="#f5f8ff" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="32" font-weight="650" text-anchor="start">本地运行环境</text><text x="552" y="320" fill="#a9eee3" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="500" text-anchor="start">Claude Code / Codex</text><text x="552" y="356" fill="#a2b3d0" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="500" text-anchor="start">OpenCode · 文件与命令</text><rect x="972" y="202" width="392" height="205" rx="31" fill="#24324d" stroke="#526381"/><text x="1002" y="258" fill="#f5f8ff" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="32" font-weight="650" text-anchor="start">你的模型网关</text><text x="1002" y="320" fill="#a9eee3" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="500" text-anchor="start">Responses / Messages</text><text x="1002" y="356" fill="#a2b3d0" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="500" text-anchor="start">地址、模型与密钥</text><path d="M464 304 H513" stroke="#72d9d0" stroke-width="4" marker-end="url(#arrow)"/><path d="M914 304 H963" stroke="#72d9d0" stroke-width="4" marker-end="url(#arrow)"/><text x="72" y="480" fill="#a2b3d0" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="500" text-anchor="start">会话和工作区保留在手机</text><text x="522" y="480" fill="#a2b3d0" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="500" text-anchor="start">执行受 Android 应用沙箱约束</text><text x="972" y="480" fill="#a2b3d0" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="500" text-anchor="start">仅任务所需内容发送到网关</text></svg>