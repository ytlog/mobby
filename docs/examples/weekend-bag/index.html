<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Weekend Bag</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="glow" aria-hidden="true"></div>

  <header class="app-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 8.5h16v9.2a2.3 2.3 0 0 1-2.3 2.3H6.3A2.3 2.3 0 0 1 4 17.7Z"/>
          <path d="M9 8.5V6.6A2.1 2.1 0 0 1 11.1 4.5h1.8A2.1 2.1 0 0 1 15 6.6v1.9"/>
          <path d="M9.5 12.4v3.1M14.5 12.4v3.1"/>
        </svg>
      </span>
      <div class="brand-text">
        <h1>Weekend Bag</h1>
        <p id="subtitle">Nothing checked yet</p>
      </div>
    </div>
  </header>

  <main class="app-main">
    <section class="progress-card" aria-labelledby="progress-heading">
      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 120 120" role="img" aria-labelledby="progress-heading">
          <title id="progress-heading">Packing progress</title>
          <circle class="ring-track" cx="60" cy="60" r="52"/>
          <circle class="ring-bar" id="ringBar" cx="60" cy="60" r="52"/>
        </svg>
        <div class="ring-center">
          <span class="ring-value" id="ringValue">0%</span>
          <span class="ring-label" id="ringCount">0 / 0</span>
        </div>
      </div>
      <div class="progress-meta">
        <p class="progress-title" id="progressTitle">Let's get packing</p>
        <p class="progress-sub" id="progressSub">Tick items off as they go in the bag.</p>
        <div class="progress-actions">
          <button type="button" class="btn btn-ghost" id="resetBtn">Reset all</button>
        </div>
      </div>
    </section>

    <div id="groups" class="groups"></div>

    <p class="footnote">Saved on this device automatically. No account, no cloud.</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
